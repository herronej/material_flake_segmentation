# hBN (MaskTerial Real_hBN_Thin): overrides on top of configs/base.yaml
#
# Produced by:
#   flakeseg-prepare-maskterial --src <unzipped>/hBN_Thin --dst data/hBN_Thin \
#       --val-fraction 0.2
#
# This is a far smaller and lower-contrast dataset than 2DFlakeSemSeg: 73 train
# and 62 test images, layers 1-3, against a material whose optical contrast is
# interference-driven rather than absorptive. Three settings below differ from
# graphene.yaml for that reason and are called out where they appear.
train_split: train
val_split: val
batch_size: 4
accum_steps: 4
num_workers: 8

# 73 images, not 20k. The graphene schedule of 60k iters would pass over every
# image hundreds of times; this is short enough to be re-run cheaply while the
# input representation is still being validated.
max_iters: 20000
warmup_iters: 500
val_interval: 1000
log_interval: 50
iters_per_epoch: 500

lr: 0.0003
encoder_lr_scale: 0.1
weight_decay: 0.05
grad_clip: 1.0
schedule: poly
poly_power: 0.9
amp_dtype: bfloat16
seed: 0
val_max_images: 0
model:
  in_channels: 3
  num_classes: 2          # binary; raise only if converted with --keep-classes
  variant: tiny
  decoder_channels: 128
  detail_channels: 32
  drop_path_rate: 0.2
  use_aux_head: true
sample:
  # CHECK against the real image size before the first run: the converter
  # reports it, and if the micrographs are smaller than this the dataset pads
  # with ignore_index and wastes most of every crop.
  crop_size: 512
  foreground_prob: 0.6    # hBN flakes are sparser and fainter than graphene
  context_factor: 1.5
  area_weight_alpha: 0.5
  area_weight_reference: 10000.0
  area_weight_max: 8.0
contrast:
  method: polynomial
  polarity: both          # hBN contrast sign is not fixed; see contrast.py
  poly_degree: 2
  poly_iterations: 3
  poly_downsample: 8
  poly_reject_sigma: 1.0
  clip: 0.5
  scale: 10.0
augment:
  flip_prob: 0.5
  rot90_prob: 0.5
  gain_prob: 0.5
  channel_gain_prob: 0.5
  vignette_prob: 0.3
  blur_prob: 0.3
  noise_prob: 0.5
  offset_prob: 0.3
loss:
  ce_weight: 1.0
  tversky_weight: 1.0
  boundary_weight: 0.5
  aux_weight: 0.4
  tversky_alpha: 0.3
  tversky_beta: 0.7
inference:
  window: 512             # match sample.crop_size
  overlap: 0.25
  context_factor: 1.5
  batch_size: 4
  flip_tta: false
  amp: true
  min_component_area: 0
data_root: data/hBN_Thin
output_dir: runs/hbn
